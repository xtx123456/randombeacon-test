name: replica
version: "1.0"
author: hermitsage <dth.bht@gmail.com>
about: Apollo node
args:
    - config:
        short: c
        long: config
        help: the config file containing startup information
        takes_value: true
        required: true
    - debug:
        short: v
        multiple: true
        help: sets the verbosity level
    - ip:
        short: i
        long: ip
        help: A file containing all the ips for the other servers
        takes_value: true
    - delta:
        short: d
        long: delta
        help: the protocol delta value
        takes_value: true
    - val:
        short: z
        long: val
        help: Value to start approximate consensus
        takes_value: true
    - epsilon:
        short: e
        long: epsilon
        help: epsilon required
        takes_value: true
    - tri:
        short: t
        long: tri
        help: tri value required
        takes_value: true
    - sleep:
        long: sleep
        help: the initial sleep time (in seconds) to ensure that all the other nodes are up and ready for the protocol
        takes_value: true
    - vsstype:
        short: s
        long: vsstype
        help: Helps determine what VSS scheme to run
        takes_value: true
    - batch:
        short: b
        long: batch
        help: Batch size used in protocol
        takes_value: true
    - syncer:
        short: y
        long: syncer
        help: IPs for the syncer to connect to
        takes_value: true
    - frequency:
        short: f
        long: frequency
        help: Frequency of initiating batchwss
        takes_value: true
    - transport:
        long: transport
        help: |
            AVSS transport selector for vsstype=ppt. One of:
              'lite'   (default) -- direct cleartext per-recipient unicast
                                    of AvssRecipientPayload + broadcast
                                    AvssPublicCommitMsg. O(n) wire msgs
                                    per dealer per round. Assumes the
                                    network layer (TLS or trusted LAN)
                                    is confidential.
              'secmsg'           -- Shoup-Smart 2024 Sec 4.3 Pi_SecMsgDst
                                    transport: per-recipient share
                                    encrypted with a Shamir-shared master
                                    key + per-recipient PRG stream,
                                    dispersed via two RBC channels.
                                    O(n^2) wire msgs per dealer per
                                    round. Suitable for plaintext-network
                                    deployments and paper-compliance
                                    benchmarks.
            Ignored when vsstype != 'ppt'.
        takes_value: true
    - field:
        long: field
        help: |
            Two-field profile selector for vsstype=ppt. One of:
              (omit)             -- default BigUint prime-field path
                                    (secret_domain ~50 bits,
                                    nonce_domain ~256 bits). Behaviour
                                    unchanged from previous releases.
              'GF2(w_p,w_q)'     -- enable the GF(2^w_p) ⊂ GF(2^w_q)
                                    binary-extension tower profile.
                                    Constraints: w_p in {1,2,4,8,16,32,
                                    64,128}, w_p divides w_q, w_q/w_p is
                                    a power of two, w_q <= 256.
                                    Example: 'GF2(64,256)', 'GF2(32,128)'.
            This commit plumbs the profile through Context only; the
            AVSS / degree-test consumers still use BigUint regardless of
            this flag. Later commits migrate consumers one at a time.
            Ignored when vsstype != 'ppt'.
        takes_value: true